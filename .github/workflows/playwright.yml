name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  create-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.create.outputs.run_id }}
    steps:
      - name: Create Qase run
        id: create
        run: |
          RESPONSE=$(curl -s -X POST "https://api.qase.io/v1/run/VI" \
            -H "Token: ${{ secrets.QASE_TESTOPS_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"title": "Booking scenarios - run ${{ github.run_id }}"}')
          RUN_ID=$(echo "$RESPONSE" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  test:
    needs: create-run
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test tests/test.spec.js --shard=${{ matrix.shard }}/4
        env:
          QASE_MODE: testops
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
          QASE_TESTOPS_RUN_ID: ${{ needs.create-run.outputs.run_id }}
          QASE_TESTOPS_RUN_COMPLETE: "false"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  complete-run:
    needs: [create-run, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Complete Qase run
        run: |
          curl -s -X POST "https://api.qase.io/v1/run/VI/${{ needs.create-run.outputs.run_id }}/complete" \
            -H "Token: ${{ secrets.QASE_TESTOPS_API_TOKEN }}"