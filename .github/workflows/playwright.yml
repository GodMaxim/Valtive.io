name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run tests batch 1 (1-5)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(1|2|3|4|5)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 2 (6-10)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(6|7|8|9|10)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 3 (11-15)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(11|12|13|14|15)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 4 (16-20)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(16|17|18|19|20)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 5 (21-25)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(21|22|23|24|25)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 6 (26-30)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(26|27|28|29|30)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 7 (31-35)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(31|32|33|34|35)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "false"

    - name: Run tests batch 8 (36-40)
      run: npx playwright test tests/test.spec.js --grep "$GREP_PATTERN" --workers=1
      env:
        GREP_PATTERN: "scenario #(36|37|38|39|40)(?!\\d)"
        QASE_MODE: testops
        QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
        QASE_TESTOPS_RUN_COMPLETE: "true"

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30